name: bench

# 只允许手动触发（Actions 页面 → Run workflow，或 gh workflow run bench）。
# 刻意不加 push / pull_request / schedule：改代码不该自动烧额度。
on:
  workflow_dispatch:
    inputs:
      runs:
        description: '每个工具重复跑几次（取最快一次做产物，其余只留指标）'
        default: '3'
        required: false
      adocao_ref:
        description: 'ADOCAO 提交/分支（留空 = 默认分支）'
        default: ''
        required: false
      hitsound_ref:
        description: 'ADOFAI_HitSound 提交/分支（留空 = 默认分支）'
        default: ''
        required: false

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Windows 上把 MSVC 环境注入 bash（ADOFAI_HitSound 的原生工具链）
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装分析依赖
        run: python -m pip install --quiet --disable-pip-version-check numpy matplotlib

      - name: 跑基准（剥离 → 构建 → 跑 → 分析）
        shell: bash
        env:
          PY: python
          RUNS: ${{ inputs.runs || '3' }}
          LABEL: ${{ matrix.os }}
          ADOCAO_REF: ${{ inputs.adocao_ref }}
          HITSOUND_REF: ${{ inputs.hitsound_ref }}
        run: bash scripts/run_bench.sh

      - name: 报告写进 Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 上传音频（两个工具的输出 + A/B 片段）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.os }}
          retention-days: 30
          path: |
            out/adocao.wav
            out/ref.wav
            out/ab_sparse.wav
            out/ab_dense.wav
            out/ab_sparse_raw.wav
            out/ab_dense_raw.wav

      - name: 上传报告（速度/内存/时间轴/响度/图表/原始日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          retention-days: 30
          path: |
            out/report.md
            out/report.json
            out/compare.png
            out/metrics_*.txt
            out/timeline_*.txt
            out/log_*.txt
            out/PROVENANCE.txt
            out/env.txt
