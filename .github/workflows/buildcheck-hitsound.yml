name: buildcheck-hitsound

# 手动触发：把 ADOFAI_HitSound 的某个分支拉到 windows-latest，
# 用原生 MSVC (cl.exe) 编译并跑一遍冒烟（含一键响度归一化），
# 用来验证「沙箱里没有 MSVC」时无法本地确认的 Windows 侧改动。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ADOFAI_HitSound 的分支/提交'
        default: 'portable-gcc'
        required: true

concurrency:
  group: buildcheck-hitsound
  cancel-in-progress: false

jobs:
  msvc:
    name: MSVC 编译 + 冒烟
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: 取被测分支
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" \
            https://github.com/Maicy0609/ADOFAI_HitSound.git src
          cd src && git log --oneline -1

      - name: cl.exe 编译（C++ + 第三方 C 文件）
        shell: cmd
        run: |
          cd src
          cl /nologo /std:c++17 /O2 /EHsc /W3 HitSound.cpp ^
             third_party\ffmpeg\ebur128\ebur128.c /D_USE_MATH_DEFINES /Fe:HitSound.exe
          dir HitSound.exe

      - name: 冒烟：生成 + 一键响度归一化
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          cd src
          python - <<'PY'
          import json
          json.dump({
              "settings": {"version": 15, "song": "smoke", "bpm": 120.0, "offset": 0.0,
                           "hitsound": "Kick", "hitsoundVolume": 100.0, "zoom": 100.0},
              "angleData": [0, 90, 180, 270, 0, 90, 180, 45, 315, 200, 60],
              "actions": [{"floor": 3, "eventType": "Twirl"},
                          {"floor": 5, "eventType": "SetSpeed", "speedType": "Multiplier",
                           "bpmMultiplier": 1.5}],
              "decorations": []
          }, open("smoke.adofai", "w"))
          PY
          printf 'smoke.adofai\ny\n-23\n' | ./HitSound.exe
          ls -la smoke*.wav

      - name: 校验产物（WAV 合法 + 增益自洽 + 不越峰值上限）
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          cd src
          python - <<'PY'
          import math, struct, wave

          def stats(path):
              w = wave.open(path)
              assert w.getsampwidth() == 2 and w.getnchannels() == 1, path
              n = w.getnframes()
              d = w.readframes(n)
              w.close()
              s = struct.unpack("<%dh" % (len(d) // 2), d)
              rms = math.sqrt(sum(x * x for x in s) / len(s)) / 32767.0
              return rms, max(abs(x) for x in s), n

          r_raw, p_raw, n_raw = stats("smoke.wav")
          r_norm, p_norm, n_norm = stats("smoke_norm.wav")
          assert n_raw == n_norm, "归一化改变了帧数"
          gain_db = 20 * math.log10(r_norm / r_raw)
          ceiling = int(32767 * 10 ** (-2.0 / 20))          # -2 dBTP 上限对应的采样值
          print(f"raw : RMS {20*math.log10(r_raw):6.2f} dBFS  peak {p_raw}")
          print(f"norm: RMS {20*math.log10(r_norm):6.2f} dBFS  peak {p_norm}")
          print(f"实测增益 {gain_db:.3f} dB（工具自报 4.524 dB）")
          print(f"-2 dBTP 上限 = {ceiling}")
          assert abs(gain_db - 4.524) < 0.05, "增益与工具自报不符"
          assert p_norm <= ceiling, "越过峰值上限"
          print("OK：两个 WAV 合法，增益自洽，未越峰值上限")
          PY
